name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dev tools (templ, hamr)
        run: make install

      - name: Verify generated templ files are committed
        run: |
          templ generate
          if ! git diff --quiet -- '*_templ.go'; then
            echo "::error::Generated templ files are out of date. Run 'templ generate' and commit."
            git diff --stat -- '*_templ.go'
            exit 1
          fi

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: make test-integration

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dev tools
        run: make install

      - name: Generate templ files
        run: templ generate

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          install-only: true

      - name: Run linters
        run: make lint

      - name: Lint templ files
        run: make templint
